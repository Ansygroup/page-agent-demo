<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>NOVA AUDIO — Premium Cinematic Store</title>
	<style>
		:root {
			--bg-void: #08080a;
			--bg-panel: #101013;
			--gold: #d4aa78;
			--gold-soft: rgba(212, 170, 120, 0.12);
			--text: #f3efe9;
			--muted: #8b867e;
			--border: rgba(255, 255, 255, 0.08);
		}
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			font-family: 'SF Pro Display', Inter, system-ui, -apple-system, sans-serif;
			background: radial-gradient(1200px 800px at 70% -10%, #1a1712 0%, var(--bg-void) 55%);
			color: var(--text);
			min-height: 100vh;
			-webkit-font-smoothing: antialiased;
		}
		header {
			display: flex; align-items: center; justify-content: space-between;
			padding: 28px 48px; border-bottom: 1px solid var(--border);
		}
		.brand { font-size: 22px; font-weight: 700; letter-spacing: 4px; }
		.brand span { color: var(--gold); }
		nav { display: flex; gap: 28px; color: var(--muted); font-size: 14px; }
		nav a { color: inherit; text-decoration: none; cursor: pointer; }
		nav a:hover { color: var(--text); }
		.hero { text-align: center; padding: 96px 24px 64px; }
		.hero h1 {
			font-size: 64px; font-weight: 800; letter-spacing: -1px; line-height: 1.05;
		}
		.hero h1 em { color: var(--gold); font-style: normal; }
		.hero p { color: var(--muted); margin-top: 18px; font-size: 18px; }
		.searchbar {
			margin: 40px auto 0; max-width: 520px; display: flex; gap: 10px;
			background: var(--bg-panel); border: 1px solid var(--border);
			border-radius: 14px; padding: 10px 14px;
		}
		.searchbar input {
			flex: 1; background: transparent; border: none; outline: none;
			color: var(--text); font-size: 15px;
		}
		.searchbar button {
			background: var(--gold); color: #1a1410; border: none; border-radius: 10px;
			padding: 8px 18px; font-weight: 600; cursor: pointer;
		}
		.grid {
			display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
			max-width: 1100px; margin: 56px auto; padding: 0 24px;
		}
		.card {
			background: var(--bg-panel); border: 1px solid var(--border);
			border-radius: 18px; padding: 28px; transition: transform .25s, border-color .25s;
		}
		.card:hover { transform: translateY(-4px); border-color: var(--gold-soft); }
		.card .thumb {
			height: 120px; border-radius: 12px; margin-bottom: 18px;
			background: linear-gradient(135deg, #211b13, #14110d);
			display: flex; align-items: center; justify-content: center;
			font-size: 40px;
		}
		.card h3 { font-size: 18px; }
		.card .desc { color: var(--muted); font-size: 13px; margin: 8px 0 16px; }
		.card .row { display: flex; align-items: center; justify-content: space-between; }
		.card .price { color: var(--gold); font-weight: 700; font-size: 18px; }
		.card .add {
			background: transparent; color: var(--text); border: 1px solid var(--border);
			border-radius: 10px; padding: 8px 16px; cursor: pointer; font-size: 13px;
		}
		.card .add:hover { border-color: var(--gold); color: var(--gold); }
		.cart {
			position: fixed; top: 96px; right: 48px; background: var(--bg-panel);
			border: 1px solid var(--border); border-radius: 14px; padding: 16px 20px;
			min-width: 180px;
		}
		.cart h4 { font-size: 13px; color: var(--muted); letter-spacing: 2px; font-weight: 600; }
		.cart .count { font-size: 30px; font-weight: 800; margin-top: 6px; }
		.newsletter { text-align: center; padding: 64px 24px 96px; }
		.newsletter input {
			background: var(--bg-panel); border: 1px solid var(--border); outline: none;
			color: var(--text); border-radius: 10px; padding: 12px 16px; width: 280px;
		}
		.newsletter button {
			background: var(--gold); color: #1a1410; border: none; border-radius: 10px;
			padding: 12px 22px; font-weight: 600; cursor: pointer; margin-left: 8px;
		}
		.toast {
			position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
			background: var(--gold); color: #1a1410; padding: 12px 24px; border-radius: 12px;
			font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .3s;
		}
		.toast.show { opacity: 1; }
	</style>
</head>
<body>
	<header>
		<div class="brand">NOVA<span>AUDIO</span></div>
		<nav>
			<a id="nav-shop">Shop</a>
			<a id="nav-about">About</a>
			<a id="nav-support">Support</a>
		</nav>
	</header>

	<section class="hero">
		<h1>Hear the <em>silence</em>.</h1>
		<p>Reference-grade wireless audio, engineered for people who notice the details.</p>
		<div class="searchbar">
			<input id="search-input" placeholder="Search products…" />
			<button id="search-btn">Search</button>
		</div>
	</section>

	<section class="grid" id="product-grid"></section>

	<aside class="cart">
		<h4>CART</h4>
		<div class="count" id="cart-count">0</div>
	</aside>

	<section class="newsletter">
		<h3 style="letter-spacing:2px;font-weight:600;margin-bottom:16px;">JOIN THE LIST</h3>
		<input id="news-email" placeholder="you@email.com" />
		<button id="news-btn">Subscribe</button>
	</section>

	<div class="toast" id="toast"></div>

	<script>
		// ---- Sample app logic (the DOM surface the agent will drive) ----
		const PRODUCTS = [
			{ id: 'p1', name: 'Nova One', icon: '🎧', desc: 'Over-ear reference headphones.', price: 349 },
			{ id: 'p2', name: 'Nova Air', icon: '🎵', desc: 'Open-ear spatial earbuds.', price: 199 },
			{ id: 'p3', name: 'Nova Pro DAC', icon: '🔊', desc: 'Portable hi-res DAC/amp.', price: 279 },
		]
		// Cart as a set of unique product ids → adding the same item is idempotent.
		const cart = new Set()
		const toast = document.getElementById('toast')
		function showToast(msg) {
			toast.textContent = msg
			toast.classList.add('show')
			setTimeout(() => toast.classList.remove('show'), 1800)
		}
		function render() {
			const grid = document.getElementById('product-grid')
			grid.innerHTML = ''
			PRODUCTS.forEach((p) => {
				const el = document.createElement('div')
				el.className = 'card'
				el.dataset.productId = p.id
				el.innerHTML = `
					<div class="thumb">${p.icon}</div>
					<h3>${p.name}</h3>
					<div class="desc">${p.desc}</div>
					<div class="row">
						<span class="price">$${p.price}</span>
						<button class="add" data-add="${p.id}">Add to cart</button>
					</div>`
				grid.appendChild(el)
			})
		}
		document.getElementById('product-grid').addEventListener('click', (e) => {
			const btn = e.target.closest('[data-add]')
			if (!btn) return
			const id = btn.dataset.add
			if (cart.has(id)) return // idempotent: don't double-add
			cart.add(id)
			document.getElementById('cart-count').textContent = cart.size
			const name = PRODUCTS.find((p) => p.id === id).name
			showToast(name + ' added to cart')
		})
		document.getElementById('search-btn').addEventListener('click', () => {
			const q = document.getElementById('search-input').value || '(empty)'
			showToast('Searching: ' + q)
		})
		document.getElementById('news-btn').addEventListener('click', () => {
			const email = document.getElementById('news-email').value
			if (!email || !email.includes('@')) return showToast('Enter a valid email')
			showToast('Subscribed ' + email)
		})
		document.getElementById('nav-about').addEventListener('click', () => showToast('About — Nova Audio, since 2026'))
		render()
	</script>

	<!-- Page Agent loader (injected config comes from the server .env) -->
	<script>
		window.__PAGE_AGENT_CONFIG__ = /*__PAGE_AGENT_CONFIG__*/ null /*__END__*/
	</script>
	<script src="./loader.js"></script>
</body>
</html>
